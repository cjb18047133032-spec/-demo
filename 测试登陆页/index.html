<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    main { width: 100%; max-width: 340px; padding: 28px; background: white; border-radius: 10px; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; }
    input { width: 100%; margin-bottom: 18px; padding: 11px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 5px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    input:focus-visible, button:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
    #message { margin: 16px 0 0; font-size: 14px; color: #555; }
    #message:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>登录</h1>
    <form id="login">
      <label for="username">账号</label>
      <input id="username" name="username" placeholder="请输入账号" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
      <button type="submit">登录</button>
      <p id="message" role="status"></p>
    </form>
  </main>
  <script>
    document.getElementById('login').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('message').textContent = '演示页面，尚未接入登录服务。';
    });
  </script>
</body>
</html>
